#
# The store of Golem: the data of the plugins in one SQLite file beside the world, read from a
# cache on the server thread and written in order by a thread of its own.

[package]
name = "golem-store"
description = "The SQLite store of the Golem plugins, with a cache for the server thread and a writer thread."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The crate that bundles the amalgamation of SQLite, named here only so that the exact pin of the
# workspace holds the SQLite of the store, which rusqlite would take in any 0.38 version.
libsqlite3-sys.workspace = true
rusqlite.workspace = true
serde.workspace = true
toml.workspace = true

[features]
# Hooks on the connection of the writer for the notebooks, which golem-devtool turns on. They hold
# the writer still or change the file behind the cache, so a notebook reaches the paths of a
# failure. The program golem never calls them, also when a build of the workspace compiles them in.
testing = []

[lints]
workspace = true
