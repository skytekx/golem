#
# The Python side of the Golem harness, pinned.
#
# Every test case of Golem is a notebook under tests/notebooks/, run by
# papermill, as in Aosabi, so the packages below and the packages they pull
# in are the whole runtime the assertions need. The packages below are
# pinned exactly, so a run on another day or another machine takes the same
# versions of them. The packages they pull in are not pinned, and pip takes
# the newest versions that fit, so a notebook result can also move with a
# new release of one of those.

[project]
name = "golem-tests"
version = "0.0.0"
description = "The notebook harness of Golem"
requires-python = ">=3.12"
license = "AGPL-3.0-only"

# papermill runs a notebook and records the parameters it was run with.
# nbclient drives the kernel for papermill.
# nbformat reads the executed notebooks back for the report.
# ipykernel is the kernel the notebooks run on, registered as golem.
# jupyter_client is the kernel protocol papermill and nbclient speak.
# pyyaml reads tests/matrix.yaml.
# reuse is the tool of the REUSE specification, which the license notebook
# holds the license lint of Golem against.
# commitizen checks the subject of a commit message, which the commit
# notebook holds the commit lint of Golem against.
dependencies = [
    "papermill==2.7.0",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "ipykernel==7.3.0",
    "jupyter_client==8.10.0",
    "pyyaml==6.0.3",
    "reuse==6.3.0",
    "commitizen==4.19.2",
]

[project.urls]
Repository = "https://github.com/skytekx/golem"
