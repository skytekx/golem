#
# The continuous integration of Golem, run on every push and on every pull request.
#
# The job licenses checks that every file states its license and its holder and that every
# license has its text, as Documentation/licensing.md describes: once with the license lint of
# Golem and once with reuse lint, the tool of the REUSE specification, pinned by version.
#
# The job commits checks every commit message of the push or the pull request, once with
# Commitizen as .cz.toml configures it and once with the commit lint of Golem for the rules of
# the Linux kernel, as CONTRIBUTING.md describes.
#
# The job notebooks runs every test case, each a Jupyter notebook under tests/notebooks/, as
# Documentation/testing.md describes. The jobs of the Rust code and of the bridge mod join them
# as the code lands.
#
# Every action is pinned to the commit of a release, with its tag beside it. No job reads a
# secret, and the token of every job can only read the repository.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Lint the licenses
        run: python3 -I .github/scripts/license_lint.py

      - name: Install reuse
        run: python3 -m pip install --disable-pip-version-check --no-input reuse==6.3.0

      - name: Lint with REUSE
        run: reuse lint

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history, so that origin/main and every commit of the branch are there.
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Lint the commit messages
        run: python3 -I .github/scripts/commit_lint.py

      - name: Install Commitizen
        run: python3 -m pip install --disable-pip-version-check --no-input commitizen==4.19.2

      # The same range as the commit lint: the commits that main does not hold, or all of
      # them while main does not exist.
      - name: Check the commit messages with Commitizen
        run: |
          if git rev-parse --verify --quiet origin/main > /dev/null; then
            range=origin/main..HEAD
          else
            range=HEAD
          fi
          cz check --rev-range "$range"

  notebooks:
    name: Notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/pyproject.toml

      # The harness takes the pinned packages of tests/pyproject.toml and runs every notebook
      # in the kernel golem of tests/.venv. The file names no build backend, so pip takes its
      # dependencies as a list of requirements.
      - name: Install the notebook harness
        run: |
          python -I - > "$RUNNER_TEMP/requirements.txt" <<'EOF'
          import tomllib

          with open("tests/pyproject.toml", "rb") as stream:
              print("\n".join(tomllib.load(stream)["project"]["dependencies"]))
          EOF
          python -m venv tests/.venv
          tests/.venv/bin/python -m pip install --disable-pip-version-check --no-input \
            --requirement "$RUNNER_TEMP/requirements.txt"
          tests/.venv/bin/python -m ipykernel install --sys-prefix --name golem \
            --display-name golem

      - name: Run the notebooks
        run: tests/.venv/bin/python tests/run.py

      - name: Keep the executed notebooks of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notebooks
          path: tests/notebooks/out/
          retention-days: 7
          if-no-files-found: ignore
