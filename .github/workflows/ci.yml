#
# The continuous integration of Golem, run on every push and on every pull request.
#
# The job licenses checks that every file states its license and its holder and that every
# license has its text, as Documentation/licensing.md describes: once with the license lint of
# Golem and once with reuse lint, the tool of the REUSE specification, pinned by version. It also
# runs the docs lint of Golem, which holds the prose of the wiki, Documentation/, CONTRIBUTING.md
# and README.md to the rules of CONTRIBUTING.md section 4, and checks that the index of the wiki
# links every page and that Documentation/testing.md names every notebook of tests/matrix.yaml.
#
# The job commits checks the message of every commit that the push or the pull request brings,
# once with Commitizen as .cz.toml configures it and once with the commit lint of Golem for the
# rules of the Linux kernel, as CONTRIBUTING.md describes. The lint picks the commits from the
# event: those a pull request adds to its base, those a push adds to main, and on another branch
# or a tag those that main does not hold.
#
# The job rust checks the format of the workspace, lints it with clippy, which denies every
# warning, builds it and its documentation, all on the toolchain of rust-toolchain.toml and the
# lock of Cargo.lock.
#
# The job dependencies runs cargo deny against deny.toml: the licenses of every crate, the
# advisories of RustSec, the bans and the sources, as Documentation/licensing.md section 7 says.
# cargo deny comes from its release, checked by its SHA-256.
#
# The job notebooks runs every test case, each a Jupyter notebook under tests/notebooks/, as
# Documentation/testing.md describes. The notebooks build the crates with cargo and the bridge
# with Gradle, and boot the Forge server that tests/fetch.py installs, so the job caches the
# downloads, the registry and the target of cargo, and the cache of Gradle, whose first build
# remaps Minecraft. Notebook 08 boots the modpack of the live server four times, under java,
# golem and Arclight and then under golem on the world of Arclight, so the job fetches the pack
# with tests/fetch.py --only modpack and caches it by the commit it pins. The downloads and the
# pack are saved right after their download, so a failed run keeps them.
#
# Every action is pinned to the commit of a release, with its tag beside it. No job reads a
# secret, and the token of every job can only read the repository.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Lint the licenses
        run: python3 -I .github/scripts/license_lint.py

      - name: Lint the documentation
        run: python3 -I .github/scripts/docs_lint.py

      - name: Install reuse
        run: python3 -m pip install --disable-pip-version-check --no-input reuse==6.3.0

      - name: Lint with REUSE
        run: reuse lint

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history, so that origin/main and every commit of the branch are there.
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # The commits of the event, which both checks judge. After a push to main, origin/main is the
      # commit pushed, so the commits that main lacks would be none.
      - name: Choose the commits of the event
        id: range
        run: |
          range=$(python3 -I .github/scripts/commit_lint.py --event "$GITHUB_EVENT_PATH" --print-range)
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Lint the commit messages
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: python3 -I .github/scripts/commit_lint.py --range "$RANGE"

      - name: Install Commitizen
        run: python3 -m pip install --disable-pip-version-check --no-input commitizen==4.19.2

      # cz check fails on a range that holds no commit, such as the push of a tag on main, where
      # the lint finds nothing to judge either.
      - name: Check the commit messages with Commitizen
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          if [ "$(git rev-list --count "$RANGE")" -eq 0 ]; then
            echo "cz check: the range $RANGE holds no commit"
          else
            cz check --rev-range "$RANGE"
          fi

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Check the format
        run: cargo fmt --all --check

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Build the documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo deny reads the graph through cargo metadata, so it needs the pinned cargo.
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"

      - name: Install cargo deny
        env:
          DENY: cargo-deny-0.18.9-x86_64-unknown-linux-musl
          DENY_SHA256: 491d04e4c05d7c92582e3d40ec94126c52472a546326a6d29473a5a4e73babd2
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/$DENY.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.18.9/$DENY.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/$DENY.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$DENY.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 "$DENY/cargo-deny"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check the dependencies
        run: cargo deny --locked check

  notebooks:
    name: Notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: notebooks-rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: notebooks-rust-${{ runner.os }}-

      # The unpacked downloads alone, keyed by their pins, which the step reads from
      # tests/fetch.py, so a change to the code of the modpack in the same file keeps them.
      # tests/fetch.py keeps a pin that is in place and downloads nothing then.
      - name: Read the pins of the downloads
        id: pins
        run: |
          digest=$(python3 -I - <<'EOF' | sha256sum | cut -c 1-64
          import importlib.util

          spec = importlib.util.spec_from_file_location("fetch", "tests/fetch.py")
          fetch = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fetch)
          print(fetch.JDK_PACKAGES, fetch.JDK_DIRECTORY, fetch.FORGE_INSTALLER, fetch.FORGE_SHA256,
                fetch.FORGE_DIRECTORY, fetch.GRADLE_URL, fetch.GRADLE_SHA256, fetch.GRADLE_DIRECTORY)
          EOF
          )
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Restored here and saved right after the download, so a run whose notebooks fail keeps
      # what it downloaded.
      - name: Restore the downloads of tests/fetch.py
        id: downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tests/.cache/jdk-17.0.21+9
            tests/.cache/forge-server
            tests/.cache/gradle-8.14.3
          key: fetch-${{ runner.os }}-${{ steps.pins.outputs.digest }}

      # The pack of notebook 08 and the repository of the server it comes from, whose size on disk
      # Documentation/testing.md gives, keyed by the commit of the server that tests/fetch.py pins,
      # so a new pin fetches the pack again. It is restored here and saved right after its download
      # as well.
      - name: Read the pin of the modpack
        id: modpack
        run: |
          commit=$(sed -n 's/^SERVER_COMMIT = "\(.*\)"$/\1/p' tests/fetch.py)
          test -n "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Restore the modpack
        id: modpack-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tests/.cache/modpack
            tests/.cache/skytekx3-1201-server
          key: modpack-${{ steps.modpack.outputs.commit }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bridge/**/*.gradle', 'bridge/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/pyproject.toml

      # The harness takes the pinned packages of tests/pyproject.toml and runs every notebook
      # in the kernel golem of tests/.venv. The file names no build backend, so pip takes its
      # dependencies as a list of requirements.
      - name: Install the notebook harness
        run: |
          python -I - > "$RUNNER_TEMP/requirements.txt" <<'EOF'
          import tomllib

          with open("tests/pyproject.toml", "rb") as stream:
              print("\n".join(tomllib.load(stream)["project"]["dependencies"]))
          EOF
          python -m venv tests/.venv
          tests/.venv/bin/python -m pip install --disable-pip-version-check --no-input \
            --requirement "$RUNNER_TEMP/requirements.txt"
          tests/.venv/bin/python -m ipykernel install --sys-prefix --name golem \
            --display-name golem

      # Temurin 17, the Forge server and Gradle. The script accepts the EULA of Minecraft for the
      # test server alone, on behalf of the owner, as its text says.
      - name: Download the JDK, the Forge server and Gradle
        run: python3 -I tests/fetch.py

      - name: Save the downloads of tests/fetch.py
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tests/.cache/jdk-17.0.21+9
            tests/.cache/forge-server
            tests/.cache/gradle-8.14.3
          key: fetch-${{ runner.os }}-${{ steps.pins.outputs.digest }}

      # The jars of the pack come from Modrinth and GitHub, each checked by the SHA-512 of the
      # index, and the libraries of Arclight from Maven Central and the repository of Sponge,
      # each checked by its pinned SHA-256. A pack in place downloads nothing.
      - name: Download the modpack of the live server
        run: python3 -I tests/fetch.py --only modpack

      - name: Save the modpack
        if: steps.modpack-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tests/.cache/modpack
            tests/.cache/skytekx3-1201-server
          key: modpack-${{ steps.modpack.outputs.commit }}

      - name: Run the notebooks
        run: tests/.venv/bin/python tests/run.py

      - name: Keep the executed notebooks of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notebooks
          path: tests/notebooks/out/
          retention-days: 7
          if-no-files-found: ignore
