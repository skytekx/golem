#
# The settings of the Gradle build of the bridge that hold on every machine.
#
# The path of the JDK 17 differs per machine, so it stays out of this file and is passed on the
# command line, as okf/bridge.md shows:
#
#     gradle -p bridge -Porg.gradle.java.installations.paths=/path/to/jdk-17 build

# ForgeGradle decompiles and remaps Minecraft, which needs more than the default heap.
org.gradle.jvmargs=-Xmx3G

# Every build starts its own process, so a run in CI or in a notebook leaves nothing behind.
org.gradle.daemon=false

# The JDK 17 is installed on purpose, never downloaded behind the back of the build.
org.gradle.java.installations.auto-download=false
