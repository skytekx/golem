#
# The calls of the contract between Rust and the bridge mod that find and read entities. The file
# is written by hand until the generator of okf/api.md section 6.2 writes it from the mapping,
# and no line of the bridge mod answers a call yet.
#
# A call names the thread class it runs on, its arguments and its answer. The argument `uuid`
# stands for the two longs of a UUID, and the argument `entity` for the runtime id, the level and
# the two longs of the UUID of an entity. An answer names each of its values with its type. A
# call that takes one of the two may miss, when the game holds no such entity, and then it answers
# nothing.

[calls.entityFind]
thread = "level"
arguments = ["uuid"]
answer = ["id: int", "level: int", "player: boolean"]
