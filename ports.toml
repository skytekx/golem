#
# The Golem plugins that port a Bukkit plugin. Each keeps the license of the plugin it ports, as
# the owner ruled on 2026-11-06, and names the holders of that plugin beside the holder of Golem.
# Rule 9 of .github/scripts/license_lint.py holds every file below the path of a port to its
# license and its holders, its Cargo.toml to its license, and NOTICE to a section on its upstream.
# Documentation/licensing.md section 6 explains the rule.
#
# A port has these fields.
#
#   name      the crate
#   path      the directory of the crate, relative to the root
#   upstream  the plugin and the version it ports, as NOTICE names it
#   source    where the source of that version lies, at its tag or its commit
#   license   the SPDX identifier of the license of the upstream, exactly
#   holders   the copyright holders of the upstream, each of which a SPDX-FileCopyrightText line
#             of every file of the port must hold

[[port]]
name = "golem-permissions"
path = "crates/golem-permissions"
upstream = "LuckPerms 5.5.71"
source = "https://github.com/LuckPerms/LuckPerms/tree/8fa4c244927c455de952fb7e74fc240871215c12"
license = "MIT"
holders = ["lucko (Luck) <luck@lucko.me>", "LuckPerms contributors"]

[[port]]
name = "golem-essentials"
path = "crates/golem-essentials"
upstream = "EssentialsX 2.22.0"
source = "https://github.com/EssentialsX/Essentials/tree/2.22.0/Essentials"
license = "GPL-3.0-or-later"
holders = ["Essentials Team", "EssentialsX contributors"]

[[port]]
name = "golem-essentials-spawn"
path = "crates/golem-essentials-spawn"
upstream = "EssentialsXSpawn 2.22.0"
source = "https://github.com/EssentialsX/Essentials/tree/2.22.0/EssentialsSpawn"
license = "GPL-3.0-or-later"
holders = ["Essentials Team", "EssentialsX contributors"]
